# ============================================================
#  ChinaCalendar 自动清洗（python3 版，仍从 master 部署 Pages）
#  放位置： fork 仓库的  .github/workflows/clean-calendar.yml
#  配套：   Settings → Pages → Deploy from a branch → master → /(root)
#  修复点： 之前 perl 字节模式对『』(高位字节0x90/0x91)匹配失败，
#           改用 python3 按 UTF-8 码点删除，最稳。
# ============================================================
name: Sync & Clean ChinaCalendar ICS

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本 fork 仓库
        uses: actions/checkout@v4

      - name: 拉取上游 ICS 并用 python3 删除 『』「」（带诊断）
        env:
          BASE: https://yangh9.github.io/ChinaCalendar
        run: |
          set -e
          export LC_ALL=C.UTF-8
          FILES="calendar.ics calendar_1.ics cal_holiday.ics cal_holiday_1.ics \
                 cal_festival.ics cal_solarTerm.ics cal_lunar.ics cal_trunkBranch.ics \
                 countdown_holiday.ics countdown_ChineseNewYear.ics"
          for f in $FILES; do
            code=$(curl -sS -o "$f.tmp" -w "%{http_code}" --retry 3 --retry-delay 5 \
                      --compressed "$BASE/$f" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              before=$(wc -m < "$f.tmp")
              python3 -c '
import sys
p = sys.argv[1]
with open(p, encoding="utf-8", errors="ignore") as fh:
    s = fh.read()
b = len(s)
for ch in ("\u3010", "\u3011", "\u300c", "\u300d"):   # 『 』 「 」
    s = s.replace(ch, "")
with open(p, "w", encoding="utf-8") as fh:
    fh.write(s)
print("cleaned:", b, "->", len(s), "(删了", b - len(s), "个字符)")
' "$f.tmp"
              after=$(wc -m < "$f.tmp")
              mv "$f.tmp" "$f"
              echo "OK   $f  http=$code  chars: $before -> $after (删了 $((before-after)) 个)"
            else
              echo "FAIL $f  http=$code  (上游拉取失败，跳过)"
              rm -f "$f.tmp"
            fi
          done

      - name: 提交并推送回 master
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "=== git status ==="
          git status --short
          if git diff --cached --quiet; then
            echo "=== 仍无变化 ==="
          else
            git commit -m "auto: strip 『』「」 from ICS"
            git push
            echo "=== 已推送，等待 Pages 重建（约 1 分钟） ==="
          fi
